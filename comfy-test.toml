# comfy-test config -- https://github.com/PozzettiAndrea/comfy-test (workflow pinned @v0.4.5)
#
# For now this is an install / import / registration smoke test across CPU OSes.
# "execution" is intentionally omitted: VOSR 2.0 is a one-step 1.4B model that
# needs a GPU -- a full run downloads ~7 GB of weights and then OOMs or times
# out on CPU CI runners. Add GPU platforms + "execution" (plus a workflows/
# folder and a [test.workflows] section) once self-hosted CUDA runners are
# available.

[test]
# "instantiation" is dropped for now: comfy-test 0.4.15 imports the package in a
# bare subprocess (no ComfyUI --cpu context), and loader.py's module-scope
# `import comfy.model_management` runs device detection that raises under
# torch 2.10 on a CPU-only box. REGISTRATION already validates a clean import +
# node registration in a real ComfyUI. Re-add once the eager comfy.* imports are
# made lazy (or the harness sets CPU mode for that subprocess).
levels = ["syntax", "install", "registration"]

[test.platforms]
platforms = ["linux-cpu", "macos-cpu", "windows-cpu", "windows-portable-cpu"]
