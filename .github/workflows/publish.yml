name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish custom node to the Comfy Registry
    runs-on: ubuntu-latest
    # Skip on forks: only the canonical repo holds REGISTRY_ACCESS_TOKEN.
    if: ${{ github.repository_owner == 'ylchen333' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
